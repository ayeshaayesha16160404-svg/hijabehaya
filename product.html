<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product | Hijab_e_Haya</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="announcement">
        Flat Rs.300 Shipping on All Orders • No Minimum Purchase
    </div>

    <header>
        <div class="logo"><a href="index.html">Noor<span>.</span></a></div>
        <nav>
            <a href="index.html#hijabs">Hijabs</a>
            <a href="index.html#abayas">Abayas</a>
            <a href="index.html#accessories">Accessories</a>
        </nav>
        <div class="cart-btn" onclick="toggleCart()">
            🛒 <span id="cart-count">0</span>
        </div>
    </header>

    <section class="product-detail">
        <div class="product-detail-container" id="product-detail">
            <!-- JS se load hoga -->
        </div>
    </section>

    <!-- Cart same -->
    <div class="cart-sidebar" id="cart">
        <div class="cart-header">
            <h3>Your Bag</h3>
            <button onclick="toggleCart()">✕</button>
        </div>
        <div id="cart-items"></div>
        <div class="cart-footer">
            <div class="total">Total: <span id="total">Rs. 0</span></div>
            <button class="whatsapp-btn" onclick="orderOnWhatsApp()">Order on WhatsApp</button>
            <button class="clear-btn" onclick="clearCart()">Clear Cart</button>
        </div>
    </div>
    <div class="overlay" id="overlay" onclick="toggleCart()"></div>

    <script src="script.js"></script>
</body>
</html>
